<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SR-71 Top</title>
  <style>
    html, body { margin:0; padding:0; background:#14181f; }
    canvas { display:block; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<canvas id="cv"></canvas>
<script type="module">
import { buildSR71 } from './lib/plane/sr71.js';
const canvas = document.getElementById('cv');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(2);
renderer.setSize(1000, 1000, false);
renderer.setClearColor(0x14181f);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xcfd8e0, 0x202428, 1.0));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(6, 10, 7);
scene.add(sun);
const plane = buildSR71(THREE);
scene.add(plane);
const cam = new THREE.OrthographicCamera(-6.5, 6.5, 6.5, -6.5, 0.1, 200);
cam.position.set(0, 30, 0);
cam.up.set(0, 0, -1);
cam.lookAt(0, 0, 0);
renderer.render(scene, cam);
</script>
</body>
</html>
