<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Flight Sim</title>
  <link rel="icon" href="data:,">
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #000;
    }
    /* The stage fills the iframe. On mobile the platform iframe is locked to
       9:16, so the stage is portrait; on desktop the platform's desktop_fill
       flag (meta.json) hands the iframe the full landscape window and the 3D
       view fills it edge-to-edge. The WebGL cameras adapt to the canvas's
       actual aspect in main.js resize(), so the world renders correctly at
       any shape. */
    #stage {
      position: fixed; inset: 0;
    }
    /* Only the WebGL game canvas fills the stage. Scoped to #game (not a bare
       `canvas` selector) so it doesn't force other canvases — e.g. the HUD
       minimap, which sets its own bottom/right corner — to top-left via the
       inset:0 here. */
    #game {
      position: absolute; inset: 0;
      display: block; width: 100%; height: 100%;
      touch-action: none;
      -webkit-touch-callout: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #boot {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #0a0e14; color: #cfd8e0; font-family: ui-monospace, Menlo, monospace;
      transition: opacity .4s ease;
    }
    #boot.hidden { opacity: 0; pointer-events: none; }
    .boot-title {
      font-size: 32px; font-weight: 700; letter-spacing: 0.18em;
      color: #ffffff; margin-bottom: 28px;
    }
    .boot-spinner {
      width: 44px; height: 44px; border-radius: 50%;
      border: 3px solid #2a3142; border-top-color: #6db4ff;
      animation: boot-spin 0.8s linear infinite;
      margin-bottom: 18px;
    }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
    .boot-phase { font-size: 13px; color: #8896aa; letter-spacing: 0.08em; }
    /* DOM UI (menu, HUD, overlays) stays in a centered 9:16 portrait column
       even when the 3D view fills a wide desktop window — so the cqi-based
       layout keeps the exact proportions it has on mobile. container-type:size
       makes every cqi unit inside resolve to THIS box, not the full window.
       On a portrait iframe the box already equals the whole stage. */
    #ui-root {
      position: absolute;
      top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: min(100vw, calc(100vh * 9 / 16));
      height: min(100vh, calc(100vw * 16 / 9));
      container-type: size;
      pointer-events: none; z-index: 50;
      overflow: hidden;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn-play.nitzan.games/lib/play-sdk.js"></script>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="1080" height="1920"></canvas>
    <div id="ui-root"></div>
  </div>
  <div id="boot">
    <div class="boot-title">FLIGHT SIM</div>
    <div class="boot-spinner"></div>
    <div class="boot-phase">Loading…</div>
  </div>
  <script type="module" src="shell/main.js"></script>
</body>
</html>
