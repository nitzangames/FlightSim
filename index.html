<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Flight Sim</title>
  <link rel="icon" href="data:,">
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #000;
      display: flex; align-items: center; justify-content: center;
    }
    /* Portrait + tall phones: fill the whole screen, no letterbox.
       The game UI sizes via container query units (cqi) so it scales
       to whatever aspect the device provides — modern phones are
       9:19.5 or taller, and the old 9:16 lock was leaving big black
       bars top/bottom. */
    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      container-type: size;
    }
    /* Landscape / desktop: keep a 9:16 portrait box centered so the
       game doesn't render as an ultrawide canvas on a monitor. The
       media query matches any screen wider than 9:16, which is every
       non-portrait device. */
    @media (min-aspect-ratio: 9 / 16) {
      #stage {
        width: auto;
        aspect-ratio: 9 / 16;
        max-width: 100vw;
      }
    }
    canvas {
      display: block; width: 100%; height: 100%;
      touch-action: none;
      -webkit-touch-callout: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #boot {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #0a0e14; color: #cfd8e0; font-family: ui-monospace, Menlo, monospace;
      transition: opacity .4s ease;
    }
    #boot.hidden { opacity: 0; pointer-events: none; }
    .boot-title {
      font-size: 32px; font-weight: 700; letter-spacing: 0.18em;
      color: #ffffff; margin-bottom: 28px;
    }
    .boot-spinner {
      width: 44px; height: 44px; border-radius: 50%;
      border: 3px solid #2a3142; border-top-color: #6db4ff;
      animation: boot-spin 0.8s linear infinite;
      margin-bottom: 18px;
    }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
    .boot-phase { font-size: 13px; color: #8896aa; letter-spacing: 0.08em; }
    #ui-root {
      position: absolute; inset: 0; pointer-events: none; z-index: 50;
      overflow: hidden;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn-play.nitzan.games/lib/play-sdk.js"></script>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="1080" height="1920"></canvas>
    <div id="ui-root"></div>
  </div>
  <div id="boot">
    <div class="boot-title">FLIGHT SIM</div>
    <div class="boot-spinner"></div>
    <div class="boot-phase">Loading…</div>
  </div>
  <script type="module" src="shell/main.js"></script>
</body>
</html>
